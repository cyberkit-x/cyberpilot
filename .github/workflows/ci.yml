name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Validate OpenSpec changes
        run: npx -y @fission-ai/openspec@1.8.0 validate build-v1 --strict

  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - test
      - code-quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false

      - name: Build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          if [[ "${GITHUB_REF_TYPE:-branch}" != "tag" ]]; then
            version="dev-${GITHUB_SHA::7}"
          fi
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          package="cyberpilot_${version}_${GOOS}_${GOARCH}"
          binary="cyberpilot"
          if [[ "$GOOS" == "windows" ]]; then
            binary="cyberpilot.exe"
          fi

          mkdir -p "dist/$package"
          go build -trimpath \
            -ldflags "-s -w -X github.com/cyberkit-x/cyberpilot/internal/buildinfo.version=$version -X github.com/cyberkit-x/cyberpilot/internal/buildinfo.commit=${GITHUB_SHA::7} -X github.com/cyberkit-x/cyberpilot/internal/buildinfo.date=$built_at" \
            -o "dist/$package/$binary" \
            ./cmd/cyberpilot
          cp README.md "dist/$package/"
          cp docs/THIRD_PARTY_LICENSES.md "dist/$package/"
          cp sandbox/BUILD_IDENTITY "dist/$package/SANDBOX_IMAGE"

          if [[ "$GOOS/$GOARCH" == "linux/amd64" ]]; then
            "dist/$package/$binary" version | grep -F "$version"
          fi

          case "$GOOS" in
            windows) file "dist/$package/$binary" | grep -F "PE32+" ;;
            darwin) file "dist/$package/$binary" | grep -F "Mach-O" ;;
            linux) file "dist/$package/$binary" | grep -F "ELF" ;;
          esac

          if [[ "$GOOS" == "windows" ]]; then
            (cd dist && zip -qr "$package.zip" "$package")
          else
            tar -C dist -czf "dist/$package.tar.gz" "$package"
          fi
          rm -rf "dist/$package"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: cyberpilot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  docker-conformance:
    name: Docker conformance
    needs:
      - test
      - code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false
      - name: Build sandbox image
        run: docker build -t cyberpilot-sandbox:ci sandbox
      - name: Run provider conformance
        env:
          CYBERPILOT_CONFORMANCE_PROVIDER: docker
          CYBERPILOT_CONFORMANCE_IMAGE: cyberpilot-sandbox:ci
        run: go test ./internal/runner/oci -run '^TestProviderConformance$' -count=1 -v

      - name: Run complete agent path
        env:
          CYBERPILOT_ACCEPTANCE_PROVIDER: docker
          CYBERPILOT_CONFORMANCE_IMAGE: cyberpilot-sandbox:ci
        run: go test ./internal/runtime -run '^TestFullOCIExecEvidenceRestartAndTUIAcceptance$' -count=1 -v

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - docker-conformance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: cyberpilot-*
          merge-multiple: true

      - name: Generate release SBOMs
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/cyberpilot-release.spdx.json

      - name: Generate checksums
        working-directory: dist
        run: sha256sum cyberpilot_* cyberpilot-release.spdx.json > checksums.txt

      - name: Verify release assets
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: scripts/verify-release-packages.sh dist

      - name: Attest release packages
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/cyberpilot_*
            dist/cyberpilot-release.spdx.json
            dist/checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: CyberPilot ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
